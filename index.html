<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴川 · 数据看板</title><style>
:root{color-scheme:light;--bg:#f4f7fa;--card:#fff;--text:#20323d;--muted:#71818b;--line:#e0e7eb;--accent:#087f76;--soft:#e6f4f1;--gap:18px;--radius:16px}:root[data-theme=dark]{color-scheme:dark;--bg:#101b22;--card:#192830;--text:#e6f0f3;--muted:#a0b3bd;--line:#30434d;--accent:#63d5c1;--soft:#213f3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif}.shell{max-width:1440px;margin:auto;padding:0 clamp(16px,4vw,64px)}header{min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:750}.logo{display:grid;place-items:center;background:var(--accent);color:var(--bg);width:38px;height:38px;border-radius:12px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.symbols{position:absolute;width:0;height:0;overflow:hidden}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:36px 0 28px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:750;color:var(--accent);margin:0 0 8px}h1{font-size:clamp(24px,2.5vw,34px);line-height:1.4;margin:0;letter-spacing:-1px}h1 span{color:var(--accent)}.muted{color:var(--muted);font-size:12px}.badge{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:30px;padding:6px 12px;color:var(--accent);font-size:11px}button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:12px;max-width:100%}button{cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px}.actions{display:flex;align-items:center;gap:12px}.toolbar label,#status{font-size:12px;color:var(--muted)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:28px 0 14px}h2{font-size:16px;margin:0}.metric-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}.metric-card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:21px}.metric-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}h3{font-size:12px;font-weight:450;margin:0}.metric-head svg{width:18px;height:18px;color:var(--accent)}.numeric{font-variant-numeric:tabular-nums}.value{font-size:clamp(27px,2.5vw,34px);font-weight:720;letter-spacing:-1px;margin:16px 0 10px;white-space:nowrap;line-height:1.3}.unit{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:5px}.metric-bottom{font-size:11px;color:var(--muted)}.delta{color:var(--accent);font-weight:650;margin-right:8px}.details{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap);margin-top:24px}.panel{min-width:0;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}.summary{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;margin-top:22px}.summary strong{font-size:27px}.chart{height:190px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,2vw,20px);margin-top:18px;background:repeating-linear-gradient(to top,transparent 0,transparent 46px,var(--line) 47px,transparent 48px);border-bottom:1px solid var(--line)}.bar-group{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bar{width:65%;max-width:46px;border-radius:5px 5px 0 0;background:var(--accent);opacity:.75}.bar-label{height:26px;padding-top:5px;font-size:10px;color:var(--muted);white-space:nowrap}.note{font-size:10px;color:var(--muted)}#channels{display:grid;gap:20px;margin-top:28px}.channel-title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.track{height:7px;background:var(--bg);border-radius:8px;overflow:hidden}.track span{display:block;height:100%;background:var(--accent);border-radius:inherit}aside{padding:14px;margin-top:24px;background:var(--soft);border-radius:10px;font-size:11px}aside strong{color:var(--accent)}aside p{color:var(--muted);margin:5px 0 0}footer{display:flex;justify-content:space-between;gap:12px;padding:28px 0;font-size:10px;color:var(--muted)}
@media(min-width:768px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1200px){.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.details{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
@media(max-width:767px){header{min-height:76px}.intro{align-items:flex-start;flex-direction:column;margin-top:28px}.toolbar{align-items:stretch;flex-direction:column;padding:14px}.actions{justify-content:space-between;flex-wrap:wrap}.section-heading .muted{font-size:10px}.panel{padding:18px}.value{font-size:32px}footer{flex-direction:column;gap:4px}}
</style></head><body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="chart-icon" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15v-4m5 4V7m5 8v-6"/></symbol><symbol id="arrow-icon" viewBox="0 0 24 24"><path d="m7 17 10-10M7 7h10v10"/></symbol></svg>
<div class="shell"><header><div class="brand"><span class="logo"><svg aria-hidden="true"><use href="#chart-icon"/></svg></span>晴川</div><button id="theme" type="button" aria-pressed="false">切换深色</button></header><main>
<div class="intro"><div><p class="eyebrow">BUSINESS OVERVIEW</p><h1>每一份增长，都清晰可见<span>。</span></h1><p class="muted">从关键指标到业务趋势，掌握运营的每一步。</p></div><span class="badge">● 演示数据</span></div>
<section class="toolbar" aria-label="数据筛选"><div><label for="period">统计周期</label> <select id="period"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option></select></div><div class="actions"><span id="status" role="status" aria-live="polite">数据已就绪</span><button id="refresh" class="primary" type="button">刷新数据</button></div></section>
<section aria-labelledby="metrics-title"><div class="section-heading"><h2 id="metrics-title">核心指标</h2><span class="muted">与上一统计周期相比</span></div><div id="metrics" class="metric-grid"></div></section>
<div class="details"><section class="panel" aria-labelledby="trend-title"><p class="eyebrow">REVENUE</p><h2 id="trend-title">收入趋势</h2><div class="summary"><strong id="total" class="numeric"></strong><span class="muted">所选周期累计收入</span></div><div id="chart" class="chart" role="img"></div><p class="note">按所选周期划分为 7 个时段，展示收入分布。</p></section><section class="panel" aria-labelledby="channels-title"><p class="eyebrow">ACQUISITION</p><h2 id="channels-title">流量来源</h2><div id="channels"></div><aside><strong>运营观察</strong><p>自然搜索是主要流量来源，可持续关注内容质量与用户体验。</p></aside></section></div>
</main><footer><span>晴川数据工作台 · HTML / CSS / 原生 JavaScript</span><span>示例数据仅用于课程作业展示</span></footer></div>
<script>
'use strict';
// 数据驱动生成 8 张卡片，HTML 不写死卡片。
const metrics=[
{title:'营业收入',value:128640,prefix:'¥',unit:'',change:12.8},
{title:'支付订单',value:1842,unit:'笔',change:8.2},
{title:'访问用户',value:28650,unit:'人',change:16.4},
{title:'支付转化率',value:6.43,unit:'%',change:2.1,digits:2,fixed:true},
{title:'新增用户',value:3256,unit:'人',change:10.6},
{title:'平均客单价',value:69.84,prefix:'¥',unit:'',change:4.3,digits:2,fixed:true},
{title:'复购率',value:28.6,unit:'%',change:3.5,digits:1,fixed:true},
{title:'用户满意度',value:98.2,unit:'%',change:1.2,digits:1,fixed:true}];
const channels=[{name:'自然搜索',share:42},{name:'直接访问',share:28},{name:'社交媒体',share:19},{name:'其他渠道',share:11}];
const period=document.querySelector('#period');
const format=(value,digits=0)=>value.toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});
let refreshCount=0;
function render(){
 const days=Number(period.value);
 document.querySelector('#metrics').innerHTML=metrics.map(item=>{
 const value=item.fixed?item.value:Math.round(item.value*days/7);
 return `<section class="metric-card" aria-label="${item.title}"><div class="metric-head"><h3>${item.title}</h3><svg aria-hidden="true"><use href="#arrow-icon"/></svg></div><p class="value numeric">${item.prefix||''}${format(value,item.digits||0)}<span class="unit">${item.unit}</span></p><div class="metric-bottom"><span class="delta numeric">↑ ${item.change}%</span>较上一周期</div></section>`;
 }).join('');
 const total=Math.round(metrics[0].value*days/7);
 const weights=[10,14,12,17,13,16,18];
 const amounts=weights.map(weight=>Math.floor(total*weight/100));
 amounts[6]+=total-amounts.reduce((sum,value)=>sum+value,0);
 document.querySelector('#total').textContent=`¥${format(total)}`;
 const chart=document.querySelector('#chart');
 chart.setAttribute('aria-label',`最近${days}天收入共${format(total)}元；`+amounts.map((value,i)=>`第${i+1}时段${format(value)}元`).join('，'));
 chart.innerHTML=amounts.map((value,i)=>`<div class="bar-group" title="第${i+1}时段：¥${format(value)}"><div class="bar" style="height:${weights[i]/18*82}%"></div><span class="bar-label">${days===7?`第${i+1}天`:`时段${i+1}`}</span></div>`).join('');
 document.querySelector('#channels').innerHTML=channels.map((item,i)=>`<div><div class="channel-title"><span>${item.name}</span><strong class="numeric">${item.share}%</strong></div><div class="track"><span style="width:${item.share}%;opacity:${1-i*.18}"></span></div></div>`).join('');
}
period.addEventListener('change',()=>{render();document.querySelector('#status').textContent=`已切换至最近 ${period.value} 天`;});
document.querySelector('#refresh').addEventListener('click',()=>{render();refreshCount++;document.querySelector('#status').textContent=`已刷新 ${refreshCount} 次 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;});
const themeButton=document.querySelector('#theme');
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';themeButton.setAttribute('aria-pressed',String(dark));themeButton.textContent=dark?'切换浅色':'切换深色';}
try{setTheme(localStorage.getItem('qingchuan-theme')==='dark');}catch{setTheme(false);}
themeButton.addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';setTheme(dark);try{localStorage.setItem('qingchuan-theme',dark?'dark':'light');}catch{/* 存储禁用不影响本次主题切换 */}});
render();
</script></body></html>
